<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AXONE — Journal des signaux</title>
<style>
  :root{
    --bg:#0b1422; --panel:#121f33; --panel2:#16263d; --line:#22344f;
    --txt:#e8eef7; --mut:#8aa0bd; --gold:#e9b949; --teal:#3fb6a8;
    --win:#2ec26a; --loss:#ef4d5a; --skip:#6b7a90; --long:#2ec26a; --short:#ef4d5a;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:radial-gradient(1200px 600px at 70% -10%,#16263d,#0b1422);color:var(--txt);
       font-family:-apple-system,Segoe UI,Roboto,Helvetica,sans-serif;-webkit-font-smoothing:antialiased;}
  .top{padding:22px 20px 10px;display:flex;align-items:center;gap:12px;}
  .logo{width:38px;height:38px;border-radius:10px;
        background:linear-gradient(135deg,var(--gold),#b8860b);
        display:grid;place-items:center;font-weight:800;color:#0b1422;font-size:18px;}
  .top h1{margin:0;font-size:18px;letter-spacing:.3px;}
  .top p{margin:2px 0 0;font-size:12px;color:var(--mut);}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:14px 20px;}
  @media(max-width:560px){.stats{grid-template-columns:repeat(2,1fr);}}
  .stat{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);
        border-radius:16px;padding:14px 16px;position:relative;overflow:hidden;}
  .stat .n{font-size:26px;font-weight:800;line-height:1;}
  .stat .l{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;margin-top:6px;}
  .stat.donut{display:flex;align-items:center;gap:14px;}
  .ring{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto;}
  .ring span{font-size:14px;font-weight:800;}
  .toolbar{display:flex;gap:8px;padding:4px 20px 10px;overflow-x:auto;}
  .chip{background:var(--panel);border:1px solid var(--line);color:var(--mut);border-radius:20px;
        padding:7px 14px;font-size:13px;white-space:nowrap;cursor:pointer;}
  .chip.on{background:var(--gold);border-color:var(--gold);color:#0b1422;font-weight:700;}
  .list{padding:4px 16px 50px;}
  .card{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);
        border-radius:16px;padding:15px 16px;margin:11px 2px;position:relative;}
  .card::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:4px;border-radius:4px;}
  .card.long::before{background:var(--long);} .card.short::before{background:var(--short);}
  .r1{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-left:8px;}
  .sym{font-weight:800;font-size:17px;}
  .pills{margin-top:6px;display:flex;gap:6px;flex-wrap:wrap;}
  .pill{font-size:10px;font-weight:700;letter-spacing:.04em;padding:3px 9px;border-radius:20px;
        background:#1d3047;color:var(--mut);text-transform:uppercase;}
  .pill.long{background:rgba(46,194,106,.15);color:var(--win);}
  .pill.short{background:rgba(239,77,90,.15);color:var(--loss);}
  .pill.rr{background:rgba(63,182,168,.15);color:var(--teal);}
  .time{font-size:11px;color:var(--mut);white-space:nowrap;}
  .lv{display:flex;gap:14px;margin:12px 0 4px 8px;font-size:13px;color:var(--mut);flex-wrap:wrap;}
  .lv b{color:var(--txt);font-weight:700;}
  .seg{display:flex;gap:8px;margin:12px 0 0 8px;}
  .seg button{flex:1;border:1px solid var(--line);background:#0e1b2c;color:var(--mut);
        border-radius:10px;padding:10px;font-size:13px;font-weight:600;cursor:pointer;transition:.15s;}
  .seg button:active{transform:scale(.97);}
  .seg button.on.win{background:var(--win);border-color:var(--win);color:#06210f;}
  .seg button.on.loss{background:var(--loss);border-color:var(--loss);color:#2a0408;}
  .seg button.on.skip{background:var(--skip);border-color:var(--skip);color:#0b1422;}
  .note{width:calc(100% - 8px);margin:10px 0 0 8px;background:#0e1b2c;border:1px solid var(--line);
        border-radius:10px;color:var(--txt);padding:10px;font-size:13px;font-family:inherit;resize:vertical;}
  .note::placeholder{color:#5a6c84;}
  .empty{text-align:center;color:var(--mut);padding:50px 20px;line-height:1.6;}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--teal);display:inline-block;margin-right:6px;
       box-shadow:0 0 0 0 rgba(63,182,168,.6);animation:pulse 2s infinite;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(63,182,168,.5)}70%{box-shadow:0 0 0 7px rgba(63,182,168,0)}100%{box-shadow:0 0 0 0 rgba(63,182,168,0)}}
</style>
</head>
<body>
  <div class="top">
    <div class="logo">A</div>
    <div>
      <h1>AXONE · Journal des signaux</h1>
      <p><span class="dot"></span>en direct · mise à jour auto</p>
    </div>
  </div>

  <div class="stats" id="stats"></div>
  <div class="toolbar" id="toolbar"></div>
  <div class="list" id="list"></div>

<script>
const STRAT={S1:'Liquidité',S2:'Pivot',EW:'Elliott'};
let DATA=[], FILTER='all';

async function load(){
  const r=await fetch('/api/signals'); DATA=await r.json();
  renderStats(); renderToolbar(); renderList();
}
function ringStyle(p){
  const deg=Math.round(p*3.6);
  const col=p>=50?'var(--win)':'var(--loss)';
  return `background:conic-gradient(${col} ${deg}deg, #21344e 0deg);`;
}
function renderStats(){
  const d=DATA;
  const win=d.filter(x=>x.result==='win').length;
  const loss=d.filter(x=>x.result==='loss').length;
  const done=win+loss, wr=done?Math.round(win/done*100):0;
  document.getElementById('stats').innerHTML=`
    <div class="stat"><div class="n">${d.length}</div><div class="l">Signaux</div></div>
    <div class="stat"><div class="n" style="color:var(--win)">${win}</div><div class="l">Gagnés</div></div>
    <div class="stat"><div class="n" style="color:var(--loss)">${loss}</div><div class="l">Perdus</div></div>
    <div class="stat donut">
      <div class="ring" style="${ringStyle(wr)}"><div class="ring" style="width:40px;height:40px;background:var(--panel2)"><span>${wr}%</span></div></div>
      <div class="l">Taux de<br>réussite</div>
    </div>`;
}
function renderToolbar(){
  const opts=[['all','Tous'],['futures','⚙️ Futures'],['forex','💱 Forex'],['S1','Liquidité'],['S2','Pivot'],['EW','Elliott']];
  document.getElementById('toolbar').innerHTML=opts.map(([k,l])=>
    `<div class="chip ${FILTER===k?'on':''}" onclick="setFilter('${k}')">${l}</div>`).join('');
}
function setFilter(f){FILTER=f;renderToolbar();renderList();}
function visible(){
  return DATA.filter(s=> FILTER==='all'||s.market===FILTER||s.strat===FILTER);
}
function renderList(){
  const el=document.getElementById('list'), d=visible();
  if(!d.length){el.innerHTML='<div class="empty">Aucun signal pour l\'instant.<br>Ils apparaîtront ici automatiquement dès qu\'ils tombent sur Telegram. 📲</div>';return;}
  el.innerHTML=d.map(s=>{
    const t=new Date(s.created_at).toLocaleString('fr-FR',{weekday:'short',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
    const mkt=s.market==='futures'?'⚙️':'💱';
    return `<div class="card ${s.side}">
      <div class="r1">
        <div>
          <div class="sym">${mkt} ${s.sym}</div>
          <div class="pills">
            <span class="pill ${s.side}">${s.side==='long'?'LONG':'SHORT'}</span>
            <span class="pill">${STRAT[s.strat]||s.strat}</span>
            <span class="pill rr">R:R ${s.rr??'-'}</span>
            <span class="pill">${s.size}</span>
          </div>
        </div>
        <div class="time">${t}</div>
      </div>
      <div class="lv">🎯 Entrée <b>${s.entry}</b> &nbsp;·&nbsp; 🛑 SL <b>${s.sl}</b> &nbsp;·&nbsp; 🏁 TP <b>${s.tp}</b></div>
      <div class="seg">
        <button class="win ${s.result==='win'?'on':''}" onclick="setRes(${s.id},'win')">✅ Gagné</button>
        <button class="loss ${s.result==='loss'?'on':''}" onclick="setRes(${s.id},'loss')">❌ Perdu</button>
        <button class="skip ${s.result==='skip'?'on':''}" onclick="setRes(${s.id},'skip')">⏭️ Pas pris</button>
      </div>
      <textarea class="note" rows="1" placeholder="Ajouter une note..." onchange="setNote(${s.id},this.value)">${(s.note||'').replace(/</g,'&lt;')}</textarea>
    </div>`;
  }).join('');
}
async function setRes(id,result){
  const s=DATA.find(x=>x.id===id); if(s)s.result=s.result===result?'':result;
  renderStats();renderList();
  await fetch('/api/signals/'+id,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({result:s?s.result:result})});
}
async function setNote(id,note){
  await fetch('/api/signals/'+id,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({note})});
}
load(); setInterval(load,30000);
</script>
</body>
</html>
