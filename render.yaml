# Déploiement cloud (Render) — bot 24/7, marche même ordinateur éteint.
# Les 3 secrets (token, chat id, webhook secret) se règlent dans le dashboard Render.
services:
  - type: web
    name: axone-signal-relay
    runtime: python
    rootDir: relay
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: WEBHOOK_SECRET
        sync: false

  # Bot de veille : surveille des canaux Telegram (BRICS News, Watcher Guru…)
  # et relaie dans ton canal les news $/€/NASDAQ/or/IPO/crypto.
  - type: web
    name: axone-veille
    runtime: python
    rootDir: veille
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: TELETHON_API_ID
        sync: false
      - key: TELETHON_API_HASH
        sync: false
      - key: TELETHON_SESSION
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
